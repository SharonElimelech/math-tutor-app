<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1f2937">
  <title>המורה שלי - ניהול שיעורים פרטיים</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <header class="app-header">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/><path d="M22 10v6"/></svg>
      המורה שלי
    </h1>
    <div id="reminderBadge" class="reminder-badge hidden"></div>
  </header>

  <main id="app">
    <!-- מסך: בית / שיעורים קרובים -->
    <section id="view-home" class="view active">
      <h2>שלום</h2>
      <div id="todaySummary" class="card summary-card"></div>
      <h3>השיעורים הקרובים</h3>
      <div id="upcomingLessons" class="list"></div>
      <h3>תזכורות תשלום ממתינות</h3>
      <div id="paymentAlerts" class="list"></div>

      <h3>גיבוי נתונים</h3>
      <div class="card">
        <div class="item-sub" style="margin-bottom:10px">הנתונים נשמרים על המכשיר בלבד. מומלץ לגבות מדי פעם לקובץ, וגם להעביר נתונים בין מכשירים.</div>
        <button class="btn btn-light btn-block" onclick="App.exportData()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>ייצוא גיבוי לקובץ</button>
        <button class="btn btn-light btn-block" onclick="document.getElementById('importFile').click()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>שחזור מקובץ גיבוי</button>
        <input id="importFile" type="file" accept="application/json" style="display:none" onchange="App.importData(event)">
      </div>
    </section>

    <!-- מסך: תלמידים -->
    <section id="view-students" class="view">
      <div class="view-head">
        <h2>התלמידים שלי</h2>
        <button class="btn-add" onclick="App.openStudentForm()">+ תלמיד</button>
      </div>
      <div class="search-wrap">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="studentSearch" class="search-box" type="search" placeholder="חיפוש תלמיד..." oninput="App.renderStudents()">
      </div>
      <div id="studentsList" class="list"></div>
    </section>

    <!-- מסך: יומן -->
    <section id="view-calendar" class="view">
      <div class="view-head">
        <h2>יומן שיעורים</h2>
        <button class="btn-add" onclick="App.openLessonForm()">+ שיעור</button>
      </div>
      <div id="lessonsList" class="list"></div>
    </section>

    <!-- מסך: תשלומים -->
    <section id="view-payments" class="view">
      <h2>מעקב תשלומים</h2>
      <div id="paymentsList" class="list"></div>
    </section>

    <!-- מסך: סיכום -->
    <section id="view-income" class="view">
      <h2>סיכום הכנסות</h2>
      <div class="month-nav">
        <button onclick="App.changeMonth(-1)">‹ קודם</button>
        <span id="currentMonthLabel"></span>
        <button onclick="App.changeMonth(1)">הבא ›</button>
      </div>
      <div id="incomeSummary"></div>
      <canvas id="incomeChart" height="200"></canvas>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home" onclick="App.go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/></svg>בית</button>
    <button class="nav-btn" data-view="students" onclick="App.go('students')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="8" r="3.5"/><path d="M21 20v-1.5a4 4 0 0 0-3-3.9"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/></svg>תלמידים</button>
    <button class="nav-btn" data-view="calendar" onclick="App.go('calendar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 9.5h18"/></svg>יומן</button>
    <button class="nav-btn" data-view="payments" onclick="App.go('payments')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5.5a1.5 1.5 0 0 0-1.5-1.5H6a3 3 0 0 0 0 6h12a1.5 1.5 0 0 1 1.5 1.5V18a2 2 0 0 1-2 2H6a3 3 0 0 1-3-3V7"/><circle cx="16.5" cy="13.5" r="1.2"/></svg>תשלומים</button>
    <button class="nav-btn" data-view="income" onclick="App.go('income')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><rect x="8" y="11" width="3" height="6"/><rect x="13.5" y="7" width="3" height="10"/></svg>סיכום</button>
  </nav>

  <!-- חלון מודאל כללי -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-grabber"></div>
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
